name: Tests & Lint

on:
  push:
    # Feature branches too, so a red (strict-xfail) commit gets its own CI run before the fix.
    branches: [main, staging, dev, "feature/**", "fix/**", "chore/**", "ci/**", "docs/**", "hotfix/**"]
  pull_request:
    branches: [main, staging, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check src tests

      - name: Format check with ruff
        run: python -m ruff format --check src tests

      - name: Type check with mypy
        run: python -m mypy src

      - name: Run tests with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest

  floor:
    # The suite at the declared floor of the runtime dependencies (B-75).
    # Python 3.14 is not in the matrix yet: uuid-utils 0.9 has no wheel for it.
    name: floor (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the lowest runtime dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print('\n'.join(d.replace('>=', '==') for d in deps))" > floor.txt
          python -m pip install -r floor.txt
          python -m pip list | grep -iE "^(pydantic|uuid.utils) "

      - name: Run tests at the floor
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest --no-cov
